services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coopgig}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-coopgig}
    ports: ["5432:5432"]
    volumes: [coopgig_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai-service:
    build: ../ai-service
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

  remote-sensing-service:
    build: ../remote-sensing-service
    expose: ["8000"]
    volumes: [remote_results:/app/data/results]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build: ../backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-coopgig}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-coopgig}?schema=public
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env and set JWT_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      AI_SERVICE_URL: http://ai-service:8000
      REMOTE_SENSING_SERVICE_URL: http://remote-sensing-service:8000
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-}
      BLOCKCHAIN_CHAIN_ID: ${BLOCKCHAIN_CHAIN_ID:-31337}
      COOPGIG_REGISTRY_ADDRESS: ${COOPGIG_REGISTRY_ADDRESS:-}
      BLOCKCHAIN_SIGNER_PRIVATE_KEY: ${BLOCKCHAIN_SIGNER_PRIVATE_KEY:-}
    ports: ["4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
      ai-service: {condition: service_healthy}
      remote-sensing-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: http://localhost:4000
        VITE_USE_MOCK_API: "false"
    ports: ["8080:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  coopgig_pgdata:
  remote_results:
