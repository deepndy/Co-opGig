services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: coopgig
      POSTGRES_PASSWORD: coopgig_local_password
      POSTGRES_DB: coopgig
    ports: ["5432:5432"]
    volumes: [coopgig_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U coopgig -d coopgig"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ../backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://coopgig:coopgig_local_password@postgres:5432/coopgig?schema=public
      JWT_SECRET: local-only-change-this-secret-at-least-32-chars
      FRONTEND_ORIGIN: http://localhost:5173
      AI_SERVICE_URL: ""
      REMOTE_SENSING_SERVICE_URL: ""
    ports: ["4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  coopgig_pgdata:
